<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Black background -->
  <rect width="512" height="512" fill="#000000"/>
  
  <!-- Outer white border circle -->
  <circle cx="256" cy="256" r="250" fill="none" stroke="#ffffff" stroke-width="18"/>
  
  <!-- Inner circle with white -->
  <circle cx="256" cy="256" r="230" fill="#000000" stroke="#ffffff" stroke-width="3"/>
  
  <!-- Decorative leaf elements - all white for visibility -->
  <g transform="translate(256, 256)">
    <!-- Top leaf -->
    <path d="M 0,-80 Q 15,-60 20,-30 Q 15,-50 0,-70" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/>
    <!-- Right leaf -->
    <path d="M 80,0 Q 60,-15 30,-20 Q 50,-15 70,0" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/>
    <!-- Bottom leaf -->
    <path d="M 0,80 Q -15,60 -20,30 Q -15,50 0,70" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/>
    <!-- Left leaf -->
    <path d="M -80,0 Q -60,15 -30,20 Q -50,15 -70,0" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/>
    
    <!-- Center circle -->
    <circle cx="0" cy="0" r="45" fill="none" stroke="#ffffff" stroke-width="2"/>
    
    <!-- H text for Harvest - white -->
    <text x="0" y="18" font-size="32" font-weight="bold" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif">H</text>
  </g>
</svg>